networks:
  cluster-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24

volumes:
  arthur-data:
  wg-easy-data:

services:
  # ── WireGuard VPN + Web Dashboard ───────────────────────────
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:latest
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.disable_ipv6=0
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    volumes:
      - wg-easy-data:/etc/wireguard
    environment:
      WG_HOST: "${WG_HOST:?Set WG_HOST to your VPS IP or domain}"
      PASSWORD: "${WG_PASSWORD:?Set WG_PASSWORD for the web UI}"
      WG_DEFAULT_ADDRESS: 10.10.1.x
      WG_DEFAULT_DNS: 1.1.1.1
      WG_ALLOWED_IPS: 10.10.0.0/16
      WG_PERSISTENT_KEEPALIVE: 25
    networks:
      cluster-net:
        ipv4_address: 10.10.0.1
    restart: unless-stopped

  # ── Hermes Agents ───────────────────────────────────────────
  agent-arthur:
    image: nousresearch/hermes-agent:v2026.5.29.2
    volumes:
      - arthur-data:/opt/data
    networks:
      cluster-net:
        ipv4_address: 10.10.0.10
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["gateway", "run"]

  # Add more agents by copying the block above and assigning a
  # new static IP + volume name (e.g. 10.10.0.11, bob-data).

  # ── Setup (one-off, run with --profile setup) ───────────────

  # Interactive setup wizard for agent-arthur
  setup-arthur:
    profiles: ["setup"]
    image: nousresearch/hermes-agent:v2026.5.29.2
    volumes:
      - arthur-data:/opt/data
    command: ["setup"]

  # Create initial WireGuard peer for your laptop
  create-peer:
    profiles: ["setup"]
    image: alpine:latest
    volumes:
      - ./setup/create-peer.sh:/setup/create-peer.sh:ro
    entrypoint: ["/bin/sh", "/setup/create-peer.sh"]
    environment:
      WG_PASSWORD: "${WG_PASSWORD:?Set WG_PASSWORD}"
      PEER_NAME: "${PEER_NAME:-laptop}"
    networks:
      - cluster-net