networks:
  net:
    driver: bridge
    ipam:
      config:
        - subnet: ${WG_SUBNET:-10.10.0.0/24}

volumes:
  wg-easy-data:

services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:${WG_EASY_VERSION:-14}
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.disable_ipv6=0
    ports:
      - "${WG_PORT:-51820}:51820/udp"
    volumes:
      - wg-easy-data:/etc/wireguard
    environment:
      WG_HOST: "${WG_HOST:?Set WG_HOST to your VPS IP or domain}"
      PASSWORD_HASH: "${WG_PASSWORD_HASH:?Set WG_PASSWORD_HASH to a bcrypt hash of your password}"
      WG_DEFAULT_ADDRESS: ${WG_POOL_ADDRESS:-10.10.1.x}
      WG_DEFAULT_DNS: 1.1.1.1
      WG_ALLOWED_IPS: ${WG_ALLOWED_IPS:-10.10.0.0/16}
      WG_PERSISTENT_KEEPALIVE: 25
    networks:
      net:
        ipv4_address: ${WG_HOST_IP:-10.10.0.254}
    restart: unless-stopped
